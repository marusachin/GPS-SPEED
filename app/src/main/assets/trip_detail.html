<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#101018;color:#fff;font-family:Roboto,Arial,sans-serif}.page{height:100%;display:flex;flex-direction:column;overflow:auto}.map{height:43vh;min-height:230px;flex:none;background:#dfe8ee;position:relative}.panel{padding:14px 14px 18px;background:#17171f;border-radius:24px 24px 0 0;margin-top:-18px;position:relative}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}.stat .icon{font-size:22px;margin:1px auto 8px;background:#282830;border-radius:50%;width:54px;height:54px;display:grid;place-items:center}.stat strong{display:block;font-size:19px;white-space:nowrap}.stat span{color:#a2a2ad;font-size:13px}.distance{text-align:center;color:#c6c6cf;font-size:14px;padding:11px 0 6px}.chart-title{font-size:15px;font-weight:700;padding:6px 3px 0}.chart-sub{font-size:12px;color:#9b9ba6}.chart-wrap{height:134px;margin-top:5px;position:relative}canvas{width:100%;height:100%}.ends{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid #34343c;padding-top:10px;font-size:12px;color:#c5c5ce}.ends strong{display:block;color:#fff;font-size:13px;margin-bottom:4px}.hint{color:#aaa;font-size:12px;padding:12px 2px}.playback{position:absolute;z-index:800;left:10px;right:10px;bottom:24px;display:flex;align-items:center;gap:7px;padding:7px 9px;background:#101018ed;border-radius:12px;box-shadow:0 2px 8px #0006}.playback button{border:0;border-radius:8px;background:#1874d2;color:white;padding:7px 9px;font-weight:700}.play-speed{white-space:nowrap;font-weight:700;font-size:14px}.play-time{font-size:11px;color:#c6c6cf;white-space:nowrap}.playback input{min-width:30px;flex:1;accent-color:#1874d2}.arrow-marker{width:30px;height:30px;background:none;border:0}.arrow-marker svg{width:30px;height:30px;filter:drop-shadow(0 1px 2px #333)}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.chart-tabs{display:flex;gap:5px}.chart-tabs button{border:1px solid #41414c;border-radius:7px;padding:6px 8px;background:#282830;color:#c5c5ce;font-size:11px}.chart-tabs button.selected{background:#1874d2;color:#fff;border-color:#1874d2}.chart-wrap{height:150px}.chart-sub{font-size:11px;padding:2px 3px}.play-dot{fill:#0878e8;stroke:#fff;stroke-width:2}#start,#stop{white-space:pre-line}</style></head><body><div class="page"><div id="map" class="map"><div class="playback"><button id="playBtn" onclick="togglePlayback()">▶ Play</button><span id="playSpeed" class="play-speed">0 km/h</span><span id="playTime" class="play-time">00:00</span><button id="rateBtn" onclick="cycleRate()">1×</button><input id="seek" type="range" min="0" max="0" value="0" oninput="seekPlayback(this.value)"></div></div><div class="panel"><div class="stats"><div class="stat"><div class="icon">◷</div><strong id="duration">—</strong><span>Duration</span></div><div class="stat"><div class="icon">◉</div><strong id="average">—</strong><span>Avg speed</span></div><div class="stat"><div class="icon">ϟ</div><strong id="max">—</strong><span>Max speed</span></div></div><div class="distance" id="distance">Distance —</div><div class="distance" id="idleTime">Idle time —</div><div class="chart-head"><div><div class="chart-title">Altitude profile</div><div class="chart-sub" id="graphSub">Vertical axis: altitude • Horizontal axis: distance travelled</div></div></div><div class="chart-wrap"><canvas id="altitude"></canvas></div><div class="ends"><div><strong>START</strong><span id="start">—</span></div><div><strong>STOP</strong><span id="stop">—</span></div></div><div class="hint" id="routeHint"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map=L.map('map').setView([20,0],2),route=L.featureGroup().addTo(map),progress=L.featureGroup().addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let tripPoints=[],playIndex=0,playTimer=null,playRate=1,playMarker=null,startMarker=null,endMarker=null;
function duration(ms){let s=Math.max(0,Math.floor((ms||0)/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),r=s%60;return h?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}
function formatCoord(p){return p?Number(p.lat).toFixed(5)+', '+Number(p.lon).toFixed(5):'No GPS point'}
let cumulativeMeters=[],chartBounds=null,draggingGraphDot=false;
function haversineMeters(a,b){let r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r,q=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 12742000*Math.asin(Math.sqrt(q))}
function drawGraph(points){let c=document.getElementById('altitude');if(!c)return;let ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;let bw=Math.round(w*dpr),bh=Math.round(h*dpr);if(c.width!==bw||c.height!==bh){c.width=bw;c.height=bh}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);if(!points||points.length<2){ctx.fillStyle='#aaa';ctx.font='13px Arial';ctx.fillText('Route samples unavailable',8,h/2);return}let pad={l:48,r:10,t:15,b:24},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;if(pw<=0||ph<=0)return;let total=cumulativeMeters.length?cumulativeMeters[cumulativeMeters.length-1]:0,vals=points.map(p=>typeof p.alt==='number'&&Number.isFinite(p.alt)?p.alt:NaN),valid=vals.map((v,i)=>({v,i})).filter(a=>Number.isFinite(a.v));if(valid.length<2){ctx.fillStyle='#aaa';ctx.font='12px Arial';ctx.fillText('Altitude samples unavailable',pad.l,h/2);return}let min=Math.min(...valid.map(a=>a.v)),max=Math.max(...valid.map(a=>a.v));if(max-min<1){min-=1;max+=1}let xPoint=i=>pad.l+(total?cumulativeMeters[i]/total:0)*pw,yPoint=v=>h-pad.b-(v-min)*ph/(max-min);chartBounds={left:pad.l,right:w-pad.r,total:total};ctx.strokeStyle='#3c3c46';ctx.lineWidth=1;ctx.fillStyle='#a6a6b0';ctx.font='10px Arial';for(let j=0;j<3;j++){let f=j/2,y=pad.t+f*ph;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(Math.round(max-f*(max-min))+' m',2,y+3)}ctx.fillText('0 km',pad.l,h-5);ctx.textAlign='right';ctx.fillText((total/1000).toFixed(2)+' km',w-pad.r,h-5);ctx.textAlign='left';for(let j=1;j<valid.length;j++){let a=valid[j-1],b=valid[j],x1=xPoint(a.i),y1=yPoint(a.v),x2=xPoint(b.i),y2=yPoint(b.v),colour=speedColour(speedAt(b.i));ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=colour;ctx.lineWidth=2.8;ctx.stroke();ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x2,h-pad.b);ctx.lineTo(x1,h-pad.b);ctx.closePath();ctx.fillStyle=colour+'33';ctx.fill()}let dot=valid.reduce((best,a)=>Math.abs(a.i-playIndex)<Math.abs(best.i-playIndex)?a:best,valid[0]),dx=xPoint(dot.i),dy=yPoint(dot.v),label=Math.round(speedAt(dot.i))+' km/h';ctx.setLineDash([3,3]);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.moveTo(dx,pad.t);ctx.lineTo(dx,h-pad.b);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(dx,dy,6,0,Math.PI*2);ctx.fillStyle=speedColour(speedAt(dot.i));ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();ctx.font='bold 10px Arial';let lw=ctx.measureText(label).width+10,lx=Math.max(pad.l,Math.min(w-pad.r-lw,dx-lw/2)),ly=Math.max(pad.t,dy-25);ctx.fillStyle='#101820';ctx.fillRect(lx,ly,lw,18);ctx.fillStyle='#fff';ctx.fillText(label,lx+5,ly+12)}
function seekGraph(e){if(!tripPoints.length||!chartBounds||!chartBounds.total)return;let rect=e.currentTarget.getBoundingClientRect(),x=Math.max(chartBounds.left,Math.min(chartBounds.right,e.clientX-rect.left)),target=(x-chartBounds.left)/(chartBounds.right-chartBounds.left)*chartBounds.total,lo=0,hi=cumulativeMeters.length-1;while(lo<hi){let mid=(lo+hi)>>1;if(cumulativeMeters[mid]<target)lo=mid+1;else hi=mid}let idx=lo;if(idx>0&&Math.abs(cumulativeMeters[idx-1]-target)<Math.abs(cumulativeMeters[idx]-target))idx--;updatePlayback(idx,true)}
let graphCanvas=document.getElementById('altitude');graphCanvas.style.touchAction='none';graphCanvas.style.cursor='grab';graphCanvas.addEventListener('pointerdown',e=>{if(!tripPoints.length)return;draggingGraphDot=true;graphCanvas.style.cursor='grabbing';stopPlayback();graphCanvas.setPointerCapture(e.pointerId);seekGraph(e)});graphCanvas.addEventListener('pointermove',e=>{if(draggingGraphDot)seekGraph(e)});graphCanvas.addEventListener('pointerup',()=>{draggingGraphDot=false;graphCanvas.style.cursor='grab'});graphCanvas.addEventListener('pointercancel',()=>{draggingGraphDot=false;graphCanvas.style.cursor='grab'});function bearing(a,b){let r=Math.PI/180,y=Math.sin((b.lon-a.lon)*r)*Math.cos(a.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);return (Math.atan2(y,x)/r+360)%360}
function speedBand(s){return s>=100?'red':s>=50?'orange':s>=10?'green':'low'}function speedColour(s){let b=speedBand(s);return b==='red'?'#ef4444':b==='orange'?'#f59e0b':b==='green'?'#22c55e':'#38bdf8'}function paintSpeedSegments(layer,pts,end){layer.clearLayers();if(end<1)return;let groups={low:[],green:[],orange:[],red:[]};for(let i=1;i<=end;i++){let a=pts[i-1],b=pts[i],band=speedBand(speedAt(i));groups[band].push([[a.lat,a.lon],[b.lat,b.lon]])}for(let band of Object.keys(groups))if(groups[band].length)L.polyline(groups[band],{color:band==='red'?'#ef4444':band==='orange'?'#f59e0b':band==='green'?'#22c55e':'#38bdf8',weight:6,lineCap:'round',lineJoin:'round'}).addTo(layer)}function setPointName(which,name){let el=document.getElementById(which),p=which==='start'?tripPoints[0]:tripPoints[tripPoints.length-1];if(el&&p&&name)el.textContent=name+'\n'+formatCoord(p)}function speedAt(i){let p=tripPoints[i],s=p.speedKmh===null||p.speedKmh===undefined?NaN:Number(p.speedKmh);if(Number.isFinite(s)&&s>=0)return s;if(i<1)return 0;let a=tripPoints[i-1],dt=(Number(p.time)-Number(a.time))/1000;if(!(dt>0))return 0;let r=Math.PI/180,dl=(p.lat-a.lat)*r,dn=(p.lon-a.lon)*r,q=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(p.lat*r)*Math.sin(dn/2)**2,dist=12742000*Math.asin(Math.sqrt(q));return dist/dt*3.6}
function arrowIcon(deg){return L.divIcon({className:'arrow-marker',html:'<svg viewBox="0 0 30 30" style="transform:rotate('+deg+'deg)"><path d="M15 2 L27 27 L15 21 L3 27 Z" fill="#0878e8" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>',iconSize:[30,30],iconAnchor:[15,15]})}
function updatePlayback(i,moveMap){if(!tripPoints.length)return;playIndex=Math.max(0,Math.min(tripPoints.length-1,Number(i)||0));let p=tripPoints[playIndex],pos=[p.lat,p.lon],head=p.bearingDeg===null||p.bearingDeg===undefined?NaN:Number(p.bearingDeg);if(!Number.isFinite(head)||head<0)head=playIndex?bearing(tripPoints[playIndex-1],p):0;if(!playMarker)playMarker=L.marker(pos,{icon:arrowIcon(head),zIndexOffset:1000}).addTo(map);else playMarker.setLatLng(pos).setIcon(arrowIcon(head));paintSpeedSegments(progress,tripPoints,playIndex);if(moveMap!==false)map.panTo(pos,{animate:false});document.getElementById('playSpeed').textContent=Math.round(speedAt(playIndex))+' km/h';let start=Number(tripPoints[0].time)||0,now=Number(p.time)||start;document.getElementById('playTime').textContent=duration(Math.max(0,now-start));document.getElementById('seek').value=playIndex;drawGraph(tripPoints)}
function stopPlayback(){if(playTimer){clearInterval(playTimer);playTimer=null}document.getElementById('playBtn').textContent=playIndex>=tripPoints.length-1?'↺ Replay':'▶ Play'}
function togglePlayback(){if(tripPoints.length<2)return;if(playTimer){stopPlayback();return}if(playIndex>=tripPoints.length-1)updatePlayback(0);document.getElementById('playBtn').textContent='❚❚ Pause';playTimer=setInterval(()=>{if(playIndex>=tripPoints.length-1){stopPlayback();return}updatePlayback(playIndex+1)},Math.max(100,1000/playRate))}
function seekPlayback(i){stopPlayback();updatePlayback(i)}
function cycleRate(){playRate=playRate===1?2:playRate===2?4:1;document.getElementById('rateBtn').textContent=playRate+'×';if(playTimer){stopPlayback();togglePlayback()}}
function renderTrip(t){let pts=t.points||[],first=pts[0],last=pts[pts.length-1],km=(t.distanceMeters||0)/1000;tripPoints=pts.filter(p=>Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon)));cumulativeMeters=[];tripPoints.forEach((p,i)=>{cumulativeMeters[i]=i?cumulativeMeters[i-1]+haversineMeters(tripPoints[i-1],p):0});document.getElementById('duration').textContent=duration(t.durationMillis);document.getElementById('average').textContent=Number(t.averageKmh||0).toFixed(0)+' km/h';document.getElementById('max').textContent=Number(t.maxKmh||0).toFixed(0)+' km/h';document.getElementById('distance').textContent='Distance '+km.toFixed(2)+' km';document.getElementById('idleTime').textContent='Idle time '+duration(t.idleMillis||0);document.getElementById('start').textContent=formatCoord(first);document.getElementById('stop').textContent=formatCoord(last);tripDurationMillis=Number(t.durationMillis)||0;document.getElementById('graphSub').textContent='Vertical axis: '+(t.altitudeReference==='MSL'?'altitude above mean sea level':'GPS altitude')+' • Horizontal axis: distance travelled';document.getElementById('seek').max=Math.max(0,tripPoints.length-1);if(tripPoints.length>=2){let line=tripPoints.map(p=>[p.lat,p.lon]);paintSpeedSegments(route,tripPoints,tripPoints.length-1);map.fitBounds(route.getBounds(),{padding:[24,55]});if(startMarker)map.removeLayer(startMarker);if(endMarker)map.removeLayer(endMarker);startMarker=L.circleMarker(line[0],{radius:7,color:'#fff',weight:2,fillColor:'#138cff',fillOpacity:1}).addTo(map).bindPopup('START');endMarker=L.circleMarker(line[line.length-1],{radius:7,color:'#fff',weight:2,fillColor:'#f05b31',fillOpacity:1}).addTo(map).bindPopup('STOP');updatePlayback(0,false)}else{document.getElementById('routeHint').textContent='This trip has no saved route. New trips record the map route and altitude.';document.querySelector('.playback').style.display='none'}drawGraph(tripPoints)}window.addEventListener('resize',()=>{if(window.lastTrip)drawGraph(tripPoints)});const oldRender=renderTrip;renderTrip=function(t){window.lastTrip=t;oldRender(t)};
</script></body></html>
