<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#101018;color:#fff;font-family:Roboto,Arial,sans-serif}.page{height:100%;display:flex;flex-direction:column;overflow:auto}.map{height:43vh;min-height:230px;flex:none;background:#dfe8ee}.panel{padding:14px 14px 18px;background:#17171f;border-radius:24px 24px 0 0;margin-top:-18px;position:relative}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}.stat .icon{font-size:22px;margin:1px auto 8px;background:#282830;border-radius:50%;width:54px;height:54px;display:grid;place-items:center}.stat strong{display:block;font-size:19px;white-space:nowrap}.stat span{color:#a2a2ad;font-size:13px}.distance{text-align:center;color:#c6c6cf;font-size:14px;padding:11px 0 6px}.chart-title{font-size:15px;font-weight:700;padding:6px 3px 0}.chart-sub{font-size:12px;color:#9b9ba6}.chart-wrap{height:134px;margin-top:5px;position:relative}canvas{width:100%;height:100%}.ends{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid #34343c;padding-top:10px;font-size:12px;color:#c5c5ce}.ends strong{display:block;color:#fff;font-size:13px;margin-bottom:4px}.hint{color:#aaa;font-size:12px;padding:12px 2px}
</style></head><body><div class="page"><div id="map" class="map"></div><div class="panel"><div class="stats"><div class="stat"><div class="icon">◷</div><strong id="duration">—</strong><span>Duration</span></div><div class="stat"><div class="icon">◉</div><strong id="average">—</strong><span>Avg speed</span></div><div class="stat"><div class="icon">ϟ</div><strong id="max">—</strong><span>Max speed</span></div></div><div class="distance" id="distance">Distance —</div><div class="chart-title">Altitude profile</div><div class="chart-sub">Elevation along the recorded route</div><div class="chart-wrap"><canvas id="altitude"></canvas></div><div class="ends"><div><strong>START</strong><span id="start">—</span></div><div><strong>STOP</strong><span id="stop">—</span></div></div><div class="hint" id="routeHint"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map=L.map('map').setView([20,0],2),route=L.polyline([],{color:'#16bd55',weight:5}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
function duration(ms){let s=Math.max(0,Math.floor((ms||0)/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),r=s%60;return h?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}
function formatCoord(p){return p?Number(p.lat).toFixed(5)+', '+Number(p.lon).toFixed(5):'No GPS point'}
function drawAltitude(points){let c=document.getElementById('altitude'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);let vals=(points||[]).filter(p=>typeof p.alt==='number'&&isFinite(p.alt));if(vals.length<2){ctx.fillStyle='#aaa';ctx.font='13px Arial';ctx.fillText('Altitude samples unavailable for this trip',4,h/2);return}let min=Math.min(...vals.map(p=>p.alt)),max=Math.max(...vals.map(p=>p.alt));if(max-min<1){min-=1;max+=1}let pad=24;ctx.strokeStyle='#3c3c46';ctx.lineWidth=1;for(let i=0;i<3;i++){let y=pad+i*(h-pad*2)/2;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.fillStyle='#a6a6b0';ctx.font='10px Arial';ctx.fillText(Math.round(max)+' m',2,12);ctx.fillText(Math.round(min)+' m',2,h-3);ctx.beginPath();vals.forEach((p,i)=>{let x=pad+i*(w-pad*2)/(vals.length-1),y=h-pad-(p.alt-min)*(h-pad*2)/(max-min);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.strokeStyle='#58beff';ctx.lineWidth=3;ctx.stroke();ctx.lineTo(w-pad,h-pad);ctx.lineTo(pad,h-pad);ctx.closePath();ctx.fillStyle='rgba(88,190,255,.16)';ctx.fill()}
function renderTrip(t){let pts=t.points||[],first=pts[0],last=pts[pts.length-1],km=(t.distanceMeters||0)/1000;document.getElementById('duration').textContent=duration(t.durationMillis);document.getElementById('average').textContent=Number(t.averageKmh||0).toFixed(0)+' km/h';document.getElementById('max').textContent=Number(t.maxKmh||0).toFixed(0)+' km/h';document.getElementById('distance').textContent='Distance '+km.toFixed(2)+' km';document.getElementById('start').textContent=formatCoord(first);document.getElementById('stop').textContent=formatCoord(last);if(pts.length>=2){let line=pts.map(p=>[p.lat,p.lon]);route.setLatLngs(line);map.fitBounds(route.getBounds(),{padding:[24,24]});L.circleMarker(line[0],{radius:8,color:'#fff',weight:2,fillColor:'#138cff',fillOpacity:1}).addTo(map).bindPopup('START');L.circleMarker(line[line.length-1],{radius:8,color:'#fff',weight:2,fillColor:'#f05b31',fillOpacity:1}).addTo(map).bindPopup('STOP')}else{document.getElementById('routeHint').textContent='This trip has no saved route. New trips record the map route and altitude.'}drawAltitude(pts)}window.addEventListener('resize',()=>{if(window.lastTrip)drawAltitude(window.lastTrip.points||[])});const oldRender=renderTrip;renderTrip=function(t){window.lastTrip=t;oldRender(t)};
</script></body></html>
