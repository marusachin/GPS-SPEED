<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;background:#dfe8ee}.leaflet-control-attribution{font-size:9px}.gps-arrow{background:transparent;border:0}.gps-arrow svg{width:32px;height:32px;overflow:visible;filter:drop-shadow(0 1px 2px #333)}
#fullscreen{position:absolute;z-index:1000;right:12px;top:12px;border:0;border-radius:10px;background:#0a1220;color:white;padding:10px 14px;font-size:18px;box-shadow:0 2px 8px #3338} .info{display:none;position:absolute;z-index:1000;background:#0a1220eF;color:white;border-radius:12px;padding:10px 12px;font:600 15px system-ui;box-shadow:0 2px 8px #0005}.full .info{display:block}.alt{left:12px;top:62px}.dir{right:12px;top:62px;text-align:right}.speed{left:12px;bottom:18px}.exit{right:12px;bottom:18px} .info small{display:block;color:#bdc9d9;font-weight:400;font-size:11px}.unit{border:0;border-radius:8px;padding:4px 8px;margin-top:5px;color:white;background:#1874d2;font-size:12px}.leaflet-popup-content{font:14px system-ui}
</style></head>
<body><div id="map"></div><button id="fullscreen" onclick="Android.toggleFullscreen()">⛶</button><div class="info alt" id="altCard">Altitude —<small id="altRef">GPS</small><button class="unit" onclick="toggleAltitudeUnit()">Show feet</button></div><div class="info dir" id="dirCard">—°<small>Direction</small></div><div class="info speed" id="speedCard">0 km/h<small>Max 0 km/h</small></div><div class="info exit" onclick="Android.toggleFullscreen()">Exit full screen</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map=L.map('map').setView([20,0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
let marker=null,route=L.polyline([],{color:'#0878e8',weight:5}).addTo(map),first=true,headingAnchor=null,lastBearing=0,hasBearing=false,altMeters=false,feet=false,tapMarker=null;
function bearingBetween(a,b){let r=Math.PI/180,y=Math.sin((b[1]-a[1])*r)*Math.cos(a[0]*r),x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);return (Math.atan2(y,x)/r+360)%360}
function smoothBearing(from,to,amount){let delta=((to-from+540)%360)-180;return (from+delta*amount+360)%360}
function arrowIcon(deg){return L.divIcon({className:'gps-arrow',html:'<svg viewBox="0 0 32 32" style="transform:rotate('+deg+'deg)"><path d="M16 2 L29 29 L16 22 L3 29 Z" fill="#0878e8" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>',iconSize:[32,32],iconAnchor:[16,16]})}
function setPoint(lat,lon,acc,bearing,speed,bearingAccuracy){let p=[lat,lon],heading=Number(bearing),v=Number(speed),ba=Number(bearingAccuracy),candidate=null;if(Number.isFinite(heading)&&heading>=0&&v>=2&&(ba<0||ba<=35))candidate=heading;if(candidate===null){if(!headingAnchor)headingAnchor=p;else{let d=map.distance(headingAnchor,p),threshold=Math.max(4,Math.min(10,(Number(acc)||0)*.2));if(d>=threshold){candidate=bearingBetween(headingAnchor,p);headingAnchor=p}}}if(candidate!==null){lastBearing=hasBearing?smoothBearing(lastBearing,candidate,.22):candidate;hasBearing=true;Android.onDirectionChanged(lastBearing)}if(!marker)marker=L.marker(p,{icon:arrowIcon(lastBearing),zIndexOffset:1000}).addTo(map);else marker.setLatLng(p).setIcon(arrowIcon(lastBearing));route.addLatLng(p);if(first){map.setView(p,16);first=false}else map.panTo(p,{animate:true,duration:.4})}
function setMapInfo(speed,max,alt,known,msl,dir){document.getElementById('speedCard').innerHTML=Math.round(speed)+' km/h<small>Max '+Math.round(max)+' km/h</small>';altMeters=known?Number(alt):false;document.getElementById('altCard').firstChild.textContent=known?(feet?(alt*3.28084).toFixed(0)+' ft':Math.round(alt)+' m'):'Altitude —';document.getElementById('altRef').textContent=known?(msl?'Mean sea level':'GPS altitude'):'Waiting for GPS altitude';document.querySelector('.unit').textContent=feet?'Show meters':'Show feet';if(dir>=0)document.getElementById('dirCard').innerHTML=Math.round(dir)+'°<small>Direction</small>'}
function toggleAltitudeUnit(){feet=!feet;if(altMeters!==false)setMapInfo(parseFloat(document.getElementById('speedCard').textContent)||0,0,altMeters,true,false,-1)}
function setFullscreen(on){document.body.classList.toggle('full',on);document.getElementById('fullscreen').textContent=on?'×':'⛶';setTimeout(()=>map.invalidateSize(true),150)}
function showTappedElevation(lat,lon,elev,ok){if(!tapMarker)tapMarker=L.marker([lat,lon]).addTo(map);else tapMarker.setLatLng([lat,lon]);tapMarker.bindPopup(ok?'Terrain elevation: '+(feet?(elev*3.28084).toFixed(0)+' ft':Math.round(elev)+' m')+'<br><small>Open-Meteo • Copernicus DEM</small>':'Looking up terrain elevation…').openPopup()}
map.on('click',e=>{showTappedElevation(e.latlng.lat,e.latlng.lng,0,false);Android.onMapPointSelected(e.latlng.lat,e.latlng.lng)});
function clearRoute(){route.setLatLngs([]);first=true;headingAnchor=null}
</script></body></html>
