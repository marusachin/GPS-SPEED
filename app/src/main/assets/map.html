<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map{height:100%;width:100%;margin:0;background:#dfe8ee}.gps-arrow{position:relative;width:46px;height:54px;background:transparent}.gps-arrow svg{position:absolute;left:5px;top:18px;width:36px;height:36px;overflow:visible;filter:drop-shadow(0 1px 2px #333)}.gps-arrow .mode-icon{position:absolute;left:50%;top:-1px;transform:translateX(-50%);font-size:20px;line-height:22px;filter:drop-shadow(0 1px 2px #333)}
#fullscreen,#threeD,#followGps{position:absolute;z-index:1000;top:12px;border:0;border-radius:10px;background:#0a1220;color:white;padding:10px 14px;font:600 15px system-ui;box-shadow:0 2px 8px #3338}#fullscreen{right:12px;font-size:19px}#threeD{right:64px}#followGps{right:116px}#overlaySettings{position:absolute;z-index:1000;top:12px;right:168px;border:0;border-radius:10px;background:#0a1220;color:white;padding:10px 13px;font:600 15px system-ui;box-shadow:0 2px 8px #3338}
.overlay-panel{position:absolute;z-index:1200;top:62px;right:10px;width:min(290px,calc(100vw - 24px));padding:14px;border-radius:14px;background:#0a1220f2;color:#fff;font:14px system-ui;box-shadow:0 4px 16px #0008}.overlay-panel[hidden]{display:none}.overlay-panel label{display:flex;justify-content:space-between;gap:8px}.overlay-panel input{width:100%;accent-color:#1874d2}.overlay-panel button{border:0;border-radius:8px;padding:8px 10px;background:#1874d2;color:#fff;font-weight:700}.overlay-panel p{color:#cbd5e1;font-size:12px;margin:8px 0}.info.movable{touch-action:none;outline:1px dashed #fff9;cursor:move;user-select:none}
.info{display:none;position:absolute;z-index:1000;background:#0a1220ed;color:white;border-radius:12px;padding:10px 12px;font:600 15px system-ui;box-shadow:0 2px 8px #0005}.full .info{display:block}.alt{left:12px;top:108px}.dir{right:12px;top:62px;text-align:right}.gps{left:50%;top:12px;transform:translateX(-50%);text-align:center;white-space:nowrap}.speed{left:12px;bottom:18px}.info.exit{display:none!important}.info small{display:block;color:#bdc9d9;font-weight:400;font-size:11px}.dir{align-items:center;gap:9px}.full .dir{display:flex}.dirText{text-align:right;min-width:72px}.dirText b{font-size:17px}.compass{position:relative;width:46px;height:46px;cursor:pointer;flex:none;border:1px solid #bac8d8;border-radius:50%;background:#ffffff12;font:700 8px system-ui;color:#dce8f5}.compass span{position:absolute}.compass .n{left:50%;top:2px;transform:translateX(-50%)}.compass .e{right:3px;top:50%;transform:translateY(-50%)}.compass .s{left:50%;bottom:2px;transform:translateX(-50%)}.compass .w{left:3px;top:50%;transform:translateY(-50%)}.compass.north-up{border-color:#22c55e;box-shadow:0 0 0 2px #22c55e66}.compass.north-up .n{color:#22c55e}.compass i{position:absolute;left:50%;top:8px;width:3px;height:15px;background:#ff5964;border-radius:3px;transform-origin:50% 15px;transform:translateX(-50%)}.unit{border:0;border-radius:8px;padding:4px 8px;margin-top:5px;color:white;background:#1874d2;font-size:12px}.maplibregl-popup-content{font:14px system-ui;border-radius:10px}.maplibregl-ctrl-attrib{font-size:9px}
</style></head>
<body><div id="map"></div><button id="followGps" onclick="locateGps()" title="Return to current GPS location">◎</button><button id="overlaySettings" onclick="toggleOverlayPanel()" title="Map display settings">⚙</button><button id="threeD" onclick="toggle3d()">3D</button><button id="fullscreen" onclick="Android.toggleFullscreen()">⛶</button><div class="info alt" id="altCard">Altitude —<small id="altRef">GPS</small><button class="unit" onclick="toggleAltitudeUnit()">Show feet</button></div><div class="info dir" id="dirCard"><div class="compass" id="mapCompass" onclick="event.stopPropagation();toggleMapOrientation()" title="Tap to switch map orientation"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span><i id="compassNeedle"></i></div><div class="dirText"><b id="directionValue">—°</b><small id="directionName">Direction</small></div></div><div class="info gps" id="gpsCard">GPS searching<small id="gpsDetail">Waiting for fix</small></div><div class="info speed" id="speedCard">0 km/h<small>Max 0 km/h</small></div><div class="info exit" onclick="Android.toggleFullscreen()">Exit full screen</div><div class="overlay-panel" id="overlayPanel" hidden><label>Card opacity <span id="opacityValue">90%</span></label><input id="cardOpacity" type="range" min="35" max="100" value="90" oninput="changeCardOpacity(this.value)"><button id="moveOutputs" onclick="toggleMoveOutputs()">Move outputs: Off</button><button id="orientationToggle" onclick="toggleMapOrientation()">Map orientation: Direction up</button><p id="moveHint">Turn on moving, then drag the GPS, altitude, direction, or speed card. Positions are saved.</p><button onclick="toggleOverlayPanel()">Done</button></div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script><script>
let map=new maplibregl.Map({container:'map',style:{version:8,sources:{'osm-raster':{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap contributors'},openfreemap:{type:'vector',url:'https://tiles.openfreemap.org/planet'}},layers:[{id:'osm-basemap',type:'raster',source:'osm-raster'}]},center:[0,20],zoom:2,attributionControl:true,customAttribution:'© OpenStreetMap contributors | 3D buildings © OpenFreeMap | Terrain © Mapterhorn'});
let gpsMarker=null,arrowEl=null,travelMode='car',routeCoords=[],routeSpeeds=[],compassHeading=null,hasCompassHeading=false,first=true,headingAnchor=null,lastBearing=0,hasBearing=false,lastMapRotateAt=0,altMeters=false,feet=false,tapPopup=null,threeD=false,routeReady=false,terrainReady=false,latestSpeed=0,latestMax=0,followGps=true;
map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-left');
map.on('dragstart',()=>{followGps=false;document.getElementById('followGps').style.background='#334155'});
function distanceMeters(a,b){let rad=x=>x*Math.PI/180,R=6371000,dLat=rad(b[0]-a[0]),dLon=rad(b[1]-a[1]),v=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(v))}
function bearingBetween(a,b){let r=Math.PI/180,y=Math.sin((b[1]-a[1])*r)*Math.cos(a[0]*r),x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);return (Math.atan2(y,x)/r+360)%360}
function smoothBearing(from,to,amount){let delta=((to-from+540)%360)-180;return (from+delta*amount+360)%360}
const cardIds=['altCard','dirCard','gpsCard','speedCard'];let moveOutputs=false;
function saveOverlayPrefs(){try{let positions={};for(let id of cardIds){let e=document.getElementById(id);if(e.dataset.savedX!==undefined)positions[id]={x:Number(e.dataset.savedX),y:Number(e.dataset.savedY)}}localStorage.setItem('gpsOverlayPrefs',JSON.stringify({opacity:Number(document.getElementById('cardOpacity').value),positions:positions,northUp:northUp}))}catch(e){}}
function restoreOverlayPositions(){try{let p=JSON.parse(localStorage.getItem('gpsOverlayPrefs')||'{}');for(let id of cardIds){let e=document.getElementById(id),v=p.positions&&p.positions[id];if(v){e.dataset.savedX=v.x;e.dataset.savedY=v.y;e.style.left=(v.x*100)+'%';e.style.top=(v.y*100)+'%';e.style.right='auto';e.style.transform='none'}}requestAnimationFrame(()=>{if(document.body.classList.contains('full'))for(let id of cardIds){let e=document.getElementById(id);if(e.dataset.savedX!==undefined)clampCard(e)}})}catch(e){}}
function clampCard(e){let r=e.getBoundingClientRect(),x=Math.max(0,Math.min(window.innerWidth-r.width,r.left)),y=Math.max(0,Math.min(window.innerHeight-r.height,r.top));e.style.left=x+'px';e.style.top=y+'px';e.style.right='auto';e.style.transform='none';e.dataset.savedX=(x/Math.max(1,window.innerWidth-r.width)).toString();e.dataset.savedY=(y/Math.max(1,window.innerHeight-r.height)).toString()}
function changeCardOpacity(value){let a=Number(value)/100;document.getElementById('opacityValue').textContent=value+'%';for(let id of cardIds)document.getElementById(id).style.backgroundColor='rgba(10,18,32,'+a+')';saveOverlayPrefs()}
function toggleOverlayPanel(){let p=document.getElementById('overlayPanel');p.hidden=!p.hidden}
function toggleMoveOutputs(){moveOutputs=!moveOutputs;document.getElementById('moveOutputs').textContent='Move outputs: '+(moveOutputs?'On':'Off');document.getElementById('moveHint').textContent=moveOutputs?'Drag any output card to move it. Tap this button again when finished.':'Turn on moving, then drag a map output card.';for(let id of cardIds)document.getElementById(id).classList.toggle('movable',moveOutputs)}
let northUp=false;
function syncCompassMode(){let c=document.getElementById('mapCompass');if(c){c.classList.toggle('north-up',northUp);c.title=northUp?'Tap compass for Direction up':'Tap compass for North up'}}
function toggleMapOrientation(){northUp=!northUp;document.getElementById('orientationToggle').textContent='Map orientation: '+(northUp?'North up':'Direction up');syncCompassMode();if(northUp)map.easeTo({bearing:0,duration:400});else if(hasBearing)applyHeadingToMap(lastBearing);saveOverlayPrefs()}
let activeDrag=null;
for(let id of cardIds){let e=document.getElementById(id);e.addEventListener('pointerdown',ev=>{if(!moveOutputs)return;ev.preventDefault();ev.stopPropagation();let r=e.getBoundingClientRect();if(e.style.left===''||e.dataset.savedX===undefined){e.style.left=r.left+'px';e.style.top=r.top+'px';e.style.right='auto';e.style.transform='none'}activeDrag={el:e,dx:ev.clientX-r.left,dy:ev.clientY-r.top};e.setPointerCapture(ev.pointerId)});e.addEventListener('pointermove',ev=>{if(!activeDrag||activeDrag.el!==e)return;let x=Math.max(0,Math.min(window.innerWidth-e.offsetWidth,ev.clientX-activeDrag.dx)),y=Math.max(0,Math.min(window.innerHeight-e.offsetHeight,ev.clientY-activeDrag.dy));e.style.left=x+'px';e.style.top=y+'px';e.style.right='auto';e.style.transform='none'});e.addEventListener('pointerup',()=>{if(activeDrag&&activeDrag.el===e){clampCard(e);activeDrag=null;saveOverlayPrefs()}});e.addEventListener('pointercancel',()=>{activeDrag=null})}
function setDirectionText(degrees){let d=((Number(degrees)%360)+360)%360,short=['N','NE','E','SE','S','SW','W','NW'],full=['North','North-east','East','South-east','South','South-west','West','North-west'],i=Math.round(d/45)%8;document.getElementById('directionValue').textContent=Math.round(d)+'° '+short[i];document.getElementById('directionName').textContent=full[i];document.getElementById('compassNeedle').style.transform='translateX(-50%) rotate('+d+'deg)'}
function loadOverlayPrefs(){try{let p=JSON.parse(localStorage.getItem('gpsOverlayPrefs')||'{}'),v=p.opacity||90;northUp=!!p.northUp;document.getElementById('orientationToggle').textContent='Map orientation: '+(northUp?'North up':'Direction up');syncCompassMode();document.getElementById('cardOpacity').value=v;changeCardOpacity(v);restoreOverlayPositions()}catch(e){changeCardOpacity(90)}}
window.addEventListener('resize',()=>{for(let id of cardIds){let e=document.getElementById(id);if(e.dataset.savedX!==undefined)clampCard(e)}saveOverlayPrefs()});
function modeIcon(){return ({train:'🚆',car:'🚗',scooter:'🛵',cycle:'🚴'})[travelMode]||'🚗'}
function makeArrow(deg){let el=document.createElement('div');el.className='gps-arrow';el.innerHTML='<div class="mode-icon">'+modeIcon()+'</div><svg viewBox="0 0 36 36"><path d="M18 2 L33 33 L18 25 L3 33 Z" fill="#0878e8" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>';el.querySelector('svg').style.transform='rotate('+((deg-map.getBearing()+360)%360)+'deg)';return el}
function setTravelMode(mode){travelMode=['train','car','scooter','cycle'].includes(mode)?mode:'car';if(arrowEl){let icon=arrowEl.querySelector('.mode-icon');if(icon)icon.textContent=modeIcon()}}
function updateArrow(deg){if(!arrowEl)return;let relative=((deg-map.getBearing()+360)%360);arrowEl.querySelector('svg').style.transform='rotate('+relative+'deg)'}
function applyHeadingToMap(deg){if(!followGps||northUp)return;let delta=Math.abs(((deg-map.getBearing()+540)%360)-180),now=Date.now();if(delta>3&&now-lastMapRotateAt>220){lastMapRotateAt=now;map.easeTo({bearing:deg,duration:280})}}
map.on('rotate',()=>updateArrow(lastBearing));
function speedBand(speed){return speed>=100?'red':speed>=50?'orange':speed>=10?'green':'low'}
function speedColour(speed){let band=speedBand(speed);return band==='red'?'#ef4444':band==='orange'?'#f59e0b':band==='green'?'#22c55e':'#38bdf8'}
function routeFeature(){let features=[];for(let i=1;i<routeCoords.length;i++){let speed=routeSpeeds[i]||0;features.push({type:'Feature',geometry:{type:'LineString',coordinates:[routeCoords[i-1],routeCoords[i]]},properties:{speedBand:speedBand(speed)}})}return {type:'FeatureCollection',features}}
function setPoint(lat,lon,acc,bearing,speed,bearingAccuracy){let p=[lat,lon],heading=Number(bearing),v=Number(speed),ba=Number(bearingAccuracy),candidate=null;if(Number.isFinite(heading)&&heading>=0&&v>=2&&(ba<0||ba<=35))candidate=heading;if(candidate===null&&v<2&&hasCompassHeading)candidate=compassHeading;if(candidate===null){if(!headingAnchor)headingAnchor=p;else{let d=distanceMeters(headingAnchor,p),threshold=Math.max(4,Math.min(10,(Number(acc)||0)*.2));if(d>=threshold){candidate=bearingBetween(headingAnchor,p);headingAnchor=p}}}if(candidate!==null){lastBearing=hasBearing?smoothBearing(lastBearing,candidate,.22):candidate;hasBearing=true;updateArrow(lastBearing);applyHeadingToMap(lastBearing);Android.onDirectionChanged(lastBearing)}if(!gpsMarker){arrowEl=makeArrow(lastBearing);gpsMarker=new maplibregl.Marker({element:arrowEl,anchor:'center'}).setLngLat([lon,lat]).addTo(map)}else gpsMarker.setLngLat([lon,lat]);routeCoords.push([lon,lat]);routeSpeeds.push(v*3.6);if(routeCoords.length>6000){routeCoords.shift();routeSpeeds.shift()}if(routeReady)map.getSource('gps-route').setData(routeFeature());if(first){if(followGps)map.jumpTo({center:[lon,lat],zoom:16});first=false}else if(followGps)map.easeTo({center:[lon,lat],duration:400})}
function setCompassHeading(degrees,accuracy){let d=Number(degrees),a=Number(accuracy);if(!Number.isFinite(d)||a<1)return;compassHeading=hasCompassHeading?smoothBearing(compassHeading,d,.28):d;hasCompassHeading=true;if(latestSpeed<5){lastBearing=hasBearing?smoothBearing(lastBearing,compassHeading,.32):compassHeading;hasBearing=true;updateArrow(lastBearing);applyHeadingToMap(lastBearing);setDirectionText(lastBearing);Android.onDirectionChanged(lastBearing)}}
function setGpsInfo(accuracy,satellites){let sat=Number(satellites)||0,acc=Number(accuracy);document.getElementById('gpsCard').firstChild.textContent=sat+' satellites';document.getElementById('gpsDetail').textContent=Number.isFinite(acc)?'Accuracy ±'+Math.round(acc)+' m':'Waiting for fix'}
function setMapInfo(speed,max,alt,known,msl,dir){latestSpeed=Number(speed)||0;latestMax=Number(max)||0;document.getElementById('speedCard').innerHTML=Math.round(latestSpeed)+' km/h<small>Max '+Math.round(latestMax)+' km/h</small>';altMeters=known?Number(alt):false;document.getElementById('altCard').firstChild.textContent=known?(feet?(alt*3.28084).toFixed(0)+' ft':Math.round(alt)+' m'):'Altitude —';document.getElementById('altRef').textContent=known?(msl?'Mean sea level':'GPS altitude'):'Waiting for GPS altitude';document.querySelector('.unit').textContent=feet?'Show meters':'Show feet';if(dir>=0)setDirectionText(dir)}
function toggleAltitudeUnit(){feet=!feet;setMapInfo(latestSpeed,latestMax,altMeters===false?0:altMeters,altMeters!==false,false,-1)}
function setFullscreen(on){document.body.classList.toggle('full',on);document.getElementById('fullscreen').textContent=on?'×':'⛶';setTimeout(()=>{map.resize();if(on)for(let id of cardIds){let e=document.getElementById(id);if(e.dataset.savedX!==undefined)clampCard(e)}},150)}
function locateGps(){followGps=true;document.getElementById('followGps').style.background='#0a1220';if(gpsMarker){let p=gpsMarker.getLngLat();map.easeTo({center:[p.lng,p.lat],zoom:Math.max(16,map.getZoom()),bearing:northUp?0:(hasBearing?lastBearing:map.getBearing()),duration:500})}}
function resumeGpsFollow(){followGps=true;document.getElementById('followGps').style.background='#0a1220';if(gpsMarker){let p=gpsMarker.getLngLat();map.easeTo({center:[p.lng,p.lat],bearing:northUp?0:(hasBearing?lastBearing:map.getBearing()),duration:350})}}
function showTappedElevation(lat,lon,elev,state){let message=state===1?'Terrain elevation: '+(feet?(elev*3.28084).toFixed(0)+' ft':Math.round(elev)+' m')+'<br><small>Open-Meteo • Copernicus DEM</small>':state===-1?'Elevation unavailable. Check internet and tap again.':'Looking up terrain elevation…';if(tapPopup)tapPopup.remove();tapPopup=new maplibregl.Popup({closeButton:true,offset:18}).setLngLat([lon,lat]).setHTML(message).addTo(map)}
function applyTerrainMode(){if(!terrainReady||!map.isStyleLoaded())return;if(threeD){map.setTerrain({source:'gps-terrain',exaggeration:2});if(map.getLayer('gps-hillshade'))map.setLayoutProperty('gps-hillshade','visibility','visible')}else{map.setTerrain(null);if(map.getLayer('gps-hillshade'))map.setLayoutProperty('gps-hillshade','visibility','none')}}
function toggle3d(){threeD=!threeD;document.getElementById('threeD').textContent=threeD?'2D':'3D';if(map.getLayer('gps-3d-buildings'))map.setLayoutProperty('gps-3d-buildings','visibility',threeD?'visible':'none');applyTerrainMode();map.easeTo({pitch:threeD?60:0,duration:500})}
map.on('load',()=>{map.addSource('gps-route',{type:'geojson',data:routeFeature()});routeReady=true;map.addLayer({id:'gps-route-line',type:'line',source:'gps-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['match',['get','speedBand'],'red','#ef4444','orange','#f59e0b','green','#22c55e','#38bdf8'],'line-width':5,'line-opacity':0.9}});map.addSource('gps-terrain',{type:'raster-dem',url:'https://tiles.mapterhorn.com/tilejson.json',tileSize:512,encoding:'terrarium',maxzoom:14,attribution:'Terrain © Mapterhorn'});terrainReady=true;map.addLayer({id:'gps-hillshade',type:'hillshade',source:'gps-terrain',layout:{visibility:'none'},paint:{'hillshade-exaggeration':0.35}});map.addLayer({id:'gps-3d-buildings',source:'openfreemap','source-layer':'building',type:'fill-extrusion',minzoom:14,layout:{visibility:threeD?'visible':'none'},filter:['!=',['get','hide_3d'],true],paint:{'fill-extrusion-color':'#aab4c2','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':0.88}});applyTerrainMode()});
map.on('click',e=>{showTappedElevation(e.lngLat.lat,e.lngLat.lng,0,0);Android.onMapPointSelected(e.lngLat.lat,e.lngLat.lng)});
function clearRoute(){routeCoords=[];routeSpeeds=[];headingAnchor=null;if(routeReady)map.getSource('gps-route').setData(routeFeature())}
loadOverlayPrefs();
</script></body></html>
