<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
html,body,#map{height:100%;width:100%;margin:0;background:#dfe8ee}.gps-arrow{width:36px;height:36px;background:transparent}.gps-arrow svg{width:36px;height:36px;overflow:visible;filter:drop-shadow(0 1px 2px #333)}
#fullscreen,#threeD,#followGps{position:absolute;z-index:1000;top:12px;border:0;border-radius:10px;background:#0a1220;color:white;padding:10px 14px;font:600 15px system-ui;box-shadow:0 2px 8px #3338}#fullscreen{right:12px;font-size:19px}#threeD{right:64px}#followGps{right:116px}
.info{display:none;position:absolute;z-index:1000;background:#0a1220ed;color:white;border-radius:12px;padding:10px 12px;font:600 15px system-ui;box-shadow:0 2px 8px #0005}.full .info{display:block}.alt{left:12px;top:108px}.dir{right:12px;top:62px;text-align:right}.gps{left:50%;top:12px;transform:translateX(-50%);text-align:center;white-space:nowrap}.speed{left:12px;bottom:18px}.info.exit{display:none!important}.info small{display:block;color:#bdc9d9;font-weight:400;font-size:11px}.unit{border:0;border-radius:8px;padding:4px 8px;margin-top:5px;color:white;background:#1874d2;font-size:12px}.maplibregl-popup-content{font:14px system-ui;border-radius:10px}.maplibregl-ctrl-attrib{font-size:9px}
</style></head>
<body><div id="map"></div><button id="followGps" onclick="locateGps()" title="Return to current GPS location">◎</button><button id="threeD" onclick="toggle3d()">3D</button><button id="fullscreen" onclick="Android.toggleFullscreen()">⛶</button><div class="info alt" id="altCard">Altitude —<small id="altRef">GPS</small><button class="unit" onclick="toggleAltitudeUnit()">Show feet</button></div><div class="info dir" id="dirCard">—°<small>Direction</small></div><div class="info gps" id="gpsCard">GPS searching<small id="gpsDetail">Waiting for fix</small></div><div class="info speed" id="speedCard">0 km/h<small>Max 0 km/h</small></div><div class="info exit" onclick="Android.toggleFullscreen()">Exit full screen</div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script><script>
let map=new maplibregl.Map({container:'map',style:{version:8,sources:{'osm-raster':{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap contributors'},openfreemap:{type:'vector',url:'https://tiles.openfreemap.org/planet'}},layers:[{id:'osm-basemap',type:'raster',source:'osm-raster'}]},center:[0,20],zoom:2,attributionControl:true,customAttribution:'© OpenStreetMap contributors | 3D buildings © OpenFreeMap | Terrain © Mapterhorn'});
let gpsMarker=null,arrowEl=null,routeCoords=[],routeSpeeds=[],compassHeading=null,hasCompassHeading=false,first=true,headingAnchor=null,lastBearing=0,hasBearing=false,lastMapRotateAt=0,altMeters=false,feet=false,tapPopup=null,threeD=false,routeReady=false,terrainReady=false,latestSpeed=0,latestMax=0,followGps=true;
map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-left');
map.on('dragstart',()=>{followGps=false;document.getElementById('followGps').style.background='#334155'});
function distanceMeters(a,b){let rad=x=>x*Math.PI/180,R=6371000,dLat=rad(b[0]-a[0]),dLon=rad(b[1]-a[1]),v=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(v))}
function bearingBetween(a,b){let r=Math.PI/180,y=Math.sin((b[1]-a[1])*r)*Math.cos(a[0]*r),x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);return (Math.atan2(y,x)/r+360)%360}
function smoothBearing(from,to,amount){let delta=((to-from+540)%360)-180;return (from+delta*amount+360)%360}
function makeArrow(deg){let el=document.createElement('div');el.className='gps-arrow';el.innerHTML='<svg viewBox="0 0 36 36"><path d="M18 2 L33 33 L18 25 L3 33 Z" fill="#0878e8" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>';el.firstChild.style.transform='rotate('+((deg-map.getBearing()+360)%360)+'deg)';return el}
function updateArrow(deg){if(!arrowEl)return;let relative=((deg-map.getBearing()+360)%360);arrowEl.firstChild.style.transform='rotate('+relative+'deg)'}
function applyHeadingToMap(deg){if(!followGps)return;let delta=Math.abs(((deg-map.getBearing()+540)%360)-180),now=Date.now();if(delta>3&&now-lastMapRotateAt>220){lastMapRotateAt=now;map.easeTo({bearing:deg,duration:280})}}
map.on('rotate',()=>updateArrow(lastBearing));
function speedBand(speed){return speed>=100?'red':speed>=50?'orange':speed>=10?'green':'low'}
function speedColour(speed){let band=speedBand(speed);return band==='red'?'#ef4444':band==='orange'?'#f59e0b':band==='green'?'#22c55e':'#38bdf8'}
function routeFeature(){let features=[];for(let i=1;i<routeCoords.length;i++){let speed=routeSpeeds[i]||0;features.push({type:'Feature',geometry:{type:'LineString',coordinates:[routeCoords[i-1],routeCoords[i]]},properties:{speedBand:speedBand(speed)}})}return {type:'FeatureCollection',features}}
function setPoint(lat,lon,acc,bearing,speed,bearingAccuracy){let p=[lat,lon],heading=Number(bearing),v=Number(speed),ba=Number(bearingAccuracy),candidate=null;if(Number.isFinite(heading)&&heading>=0&&v>=2&&(ba<0||ba<=35))candidate=heading;if(candidate===null&&v<2&&hasCompassHeading)candidate=compassHeading;if(candidate===null){if(!headingAnchor)headingAnchor=p;else{let d=distanceMeters(headingAnchor,p),threshold=Math.max(4,Math.min(10,(Number(acc)||0)*.2));if(d>=threshold){candidate=bearingBetween(headingAnchor,p);headingAnchor=p}}}if(candidate!==null){lastBearing=hasBearing?smoothBearing(lastBearing,candidate,.22):candidate;hasBearing=true;updateArrow(lastBearing);applyHeadingToMap(lastBearing);Android.onDirectionChanged(lastBearing)}if(!gpsMarker){arrowEl=makeArrow(lastBearing);gpsMarker=new maplibregl.Marker({element:arrowEl,anchor:'center'}).setLngLat([lon,lat]).addTo(map)}else gpsMarker.setLngLat([lon,lat]);routeCoords.push([lon,lat]);routeSpeeds.push(v*3.6);if(routeCoords.length>6000){routeCoords.shift();routeSpeeds.shift()}if(routeReady)map.getSource('gps-route').setData(routeFeature());if(first){if(followGps)map.jumpTo({center:[lon,lat],zoom:16});first=false}else if(followGps)map.easeTo({center:[lon,lat],duration:400})}
function setCompassHeading(degrees,accuracy){let d=Number(degrees),a=Number(accuracy);if(!Number.isFinite(d)||a<1)return;compassHeading=hasCompassHeading?smoothBearing(compassHeading,d,.28):d;hasCompassHeading=true;if(latestSpeed<5){lastBearing=hasBearing?smoothBearing(lastBearing,compassHeading,.32):compassHeading;hasBearing=true;updateArrow(lastBearing);applyHeadingToMap(lastBearing);document.getElementById('dirCard').innerHTML=Math.round(lastBearing)+'°<small>Direction</small>';Android.onDirectionChanged(lastBearing)}}
function setGpsInfo(accuracy,satellites){let sat=Number(satellites)||0,acc=Number(accuracy);document.getElementById('gpsCard').firstChild.textContent=sat+' satellites';document.getElementById('gpsDetail').textContent=Number.isFinite(acc)?'Accuracy ±'+Math.round(acc)+' m':'Waiting for fix'}
function setMapInfo(speed,max,alt,known,msl,dir){latestSpeed=Number(speed)||0;latestMax=Number(max)||0;document.getElementById('speedCard').innerHTML=Math.round(latestSpeed)+' km/h<small>Max '+Math.round(latestMax)+' km/h</small>';altMeters=known?Number(alt):false;document.getElementById('altCard').firstChild.textContent=known?(feet?(alt*3.28084).toFixed(0)+' ft':Math.round(alt)+' m'):'Altitude —';document.getElementById('altRef').textContent=known?(msl?'Mean sea level':'GPS altitude'):'Waiting for GPS altitude';document.querySelector('.unit').textContent=feet?'Show meters':'Show feet';if(dir>=0)document.getElementById('dirCard').innerHTML=Math.round(dir)+'°<small>Direction</small>'}
function toggleAltitudeUnit(){feet=!feet;setMapInfo(latestSpeed,latestMax,altMeters===false?0:altMeters,altMeters!==false,false,-1)}
function setFullscreen(on){document.body.classList.toggle('full',on);document.getElementById('fullscreen').textContent=on?'×':'⛶';setTimeout(()=>map.resize(),150)}
function locateGps(){followGps=true;document.getElementById('followGps').style.background='#0a1220';if(gpsMarker){let p=gpsMarker.getLngLat();map.easeTo({center:[p.lng,p.lat],zoom:Math.max(16,map.getZoom()),bearing:hasBearing?lastBearing:map.getBearing(),duration:500})}}
function resumeGpsFollow(){followGps=true;document.getElementById('followGps').style.background='#0a1220';if(gpsMarker){let p=gpsMarker.getLngLat();map.easeTo({center:[p.lng,p.lat],bearing:hasBearing?lastBearing:map.getBearing(),duration:350})}}
function showTappedElevation(lat,lon,elev,state){let message=state===1?'Terrain elevation: '+(feet?(elev*3.28084).toFixed(0)+' ft':Math.round(elev)+' m')+'<br><small>Open-Meteo • Copernicus DEM</small>':state===-1?'Elevation unavailable. Check internet and tap again.':'Looking up terrain elevation…';if(tapPopup)tapPopup.remove();tapPopup=new maplibregl.Popup({closeButton:true,offset:18}).setLngLat([lon,lat]).setHTML(message).addTo(map)}
function applyTerrainMode(){if(!terrainReady||!map.isStyleLoaded())return;if(threeD){map.setTerrain({source:'gps-terrain',exaggeration:2});if(map.getLayer('gps-hillshade'))map.setLayoutProperty('gps-hillshade','visibility','visible')}else{map.setTerrain(null);if(map.getLayer('gps-hillshade'))map.setLayoutProperty('gps-hillshade','visibility','none')}}
function toggle3d(){threeD=!threeD;document.getElementById('threeD').textContent=threeD?'2D':'3D';if(map.getLayer('gps-3d-buildings'))map.setLayoutProperty('gps-3d-buildings','visibility',threeD?'visible':'none');applyTerrainMode();map.easeTo({pitch:threeD?60:0,duration:500})}
map.on('load',()=>{map.addSource('gps-route',{type:'geojson',data:routeFeature()});routeReady=true;map.addLayer({id:'gps-route-line',type:'line',source:'gps-route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':['match',['get','speedBand'],'red','#ef4444','orange','#f59e0b','green','#22c55e','#38bdf8'],'line-width':5,'line-opacity':0.9}});map.addSource('gps-terrain',{type:'raster-dem',url:'https://tiles.mapterhorn.com/tilejson.json',tileSize:512,encoding:'terrarium',maxzoom:14,attribution:'Terrain © Mapterhorn'});terrainReady=true;map.addLayer({id:'gps-hillshade',type:'hillshade',source:'gps-terrain',layout:{visibility:'none'},paint:{'hillshade-exaggeration':0.35}});map.addLayer({id:'gps-3d-buildings',source:'openfreemap','source-layer':'building',type:'fill-extrusion',minzoom:14,layout:{visibility:threeD?'visible':'none'},filter:['!=',['get','hide_3d'],true],paint:{'fill-extrusion-color':'#aab4c2','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':0.88}});applyTerrainMode()});
map.on('click',e=>{showTappedElevation(e.lngLat.lat,e.lngLat.lng,0,0);Android.onMapPointSelected(e.lngLat.lat,e.lngLat.lng)});
function clearRoute(){routeCoords=[];routeSpeeds=[];headingAnchor=null;if(routeReady)map.getSource('gps-route').setData(routeFeature())}
</script></body></html>
