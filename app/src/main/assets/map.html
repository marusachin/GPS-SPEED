<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;background:#dfe8ee}.leaflet-control-attribution{font-size:9px}</style></head><body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>let map=L.map('map').setView([20,0],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let marker=null,route=L.polyline([],{color:'#0878e8',weight:5}).addTo(map),first=true;function setPoint(lat,lon,acc){let p=[lat,lon];if(!marker){marker=L.circleMarker(p,{radius:8,color:'#fff',weight:3,fillColor:'#0878e8',fillOpacity:1}).addTo(map)}else marker.setLatLng(p);route.addLatLng(p);if(first){map.setView(p,16);first=false}else map.panTo(p,{animate:true,duration:.4})}function clearRoute(){route.setLatLngs([]);first=true}</script></body></html>
