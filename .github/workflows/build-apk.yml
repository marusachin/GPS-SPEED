name: Build GPS Speedometer APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Give APK a clear name
        run: cp app/build/outputs/apk/debug/app-debug.apk GPS-Speedometer-v2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GPS-Speedometer-v2.0
          path: GPS-Speedometer-v2.0.apk
          if-no-files-found: error

